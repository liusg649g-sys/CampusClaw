# CampusClaw Nginx configuration
# Run from the CampusClaw project root, for example:
#   nginx.exe -p "D:/CampusClaw/CampusClaw_nginx_python/CampusClaw/" -c "nginx/nginx.conf"

worker_processes  1;
error_log  logs/error.log notice;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20m;

    client_body_temp_path temp/client_body_temp;
    proxy_temp_path       temp/proxy_temp;

    server {
        listen       8080;
        server_name  localhost 127.0.0.1;

        root frontend;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
        }

        # Dynamic APIs -> Python backend.
        location = /login {
            proxy_pass http://127.0.0.1:5000/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        location = /logout {
            proxy_pass http://127.0.0.1:5000/logout;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        location = /change-password {
            proxy_pass http://127.0.0.1:5000/change-password;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        location = /session {
            proxy_pass http://127.0.0.1:5000/session;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        location ^~ /materials {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }


        location ^~ /knowledge {
            proxy_pass http://127.0.0.1:5000;
    	    proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
}

        location = /app-version {
            proxy_pass http://127.0.0.1:5000/app-version;
            proxy_http_version 1.1;
        }

        location = /health {
            proxy_pass http://127.0.0.1:5000/health;
            proxy_http_version 1.1;
        }
    }
}
