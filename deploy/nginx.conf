server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-store; }
    location = /mcp { return 404; }
    location ~ ^/(login|logout|session|change-password|health|app-version|docs|swagger|openapi\.json|classes|students|skills|prompts|conversations|agents|teaching-skills|materials|knowledge|api/mcp)(/|$) {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
